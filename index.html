<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日诗词 · 智能学习系统</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <div class="bg-overlay"></div>
        <nav class="top-bar">
            <div class="nav-left">
                <span class="logo">📜</span>
                <span class="app-title">每日诗词</span>
            </div>
            <div class="nav-right">
                <button id="btn-home" class="nav-btn" title="回到主页">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                    </svg>
                </button>
                <button id="btn-stats" class="nav-btn" title="学习统计">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M3 13h2v8H3zm4-4h2v12H7zm4-4h2v16h-2zm4 8h2v8h-2zm4-4h2v12h-2z" />
                    </svg>
                </button>
                <button id="btn-admin" class="nav-btn" title="诗词管理">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                    </svg>
                </button>
                <button id="btn-data" class="nav-btn" title="数据管理">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor"
                            d="M12 2C6.48 2 2 4.69 2 8v8c0 3.31 4.48 6 10 6s10-2.69 10-6V8c0-3.31-4.48-6-10-6zm0 2c4.42 0 8 1.79 8 4s-3.58 4-8 4-8-1.79-8-4 3.58-4 8-4zM4 16v-2.47c1.82 1.47 4.74 2.47 8 2.47s6.18-1 8-2.47V16c0 2.21-3.58 4-8 4s-8-1.79-8-4zm0-4v-2.47C5.82 10.97 8.74 12 12 12s6.18-1 8-2.47V12c0 2.21-3.58 4-8 4s-8-1.79-8-4z" />
                    </svg>
                </button>
            </div>
        </nav>

        <main class="main-content">
            <section id="page-home" class="page active">
                <div class="home-header">
                    <h2 class="date-display"></h2>
                    <div class="progress-bar-wrap">
                        <div class="progress-bar" id="daily-progress">
                            <div class="progress-fill"></div>
                        </div>
                        <span class="progress-text" id="progress-text">今日进度 0/0</span>
                    </div>
                </div>
                <div class="home-status" id="home-status">
                    <div class="status-card">
                        <span class="status-num" id="stat-new">0</span>
                        <span class="status-label">今日新学</span>
                    </div>
                    <div class="status-card">
                        <span class="status-num" id="stat-review">0</span>
                        <span class="status-label">待复习</span>
                    </div>
                    <div class="status-card">
                        <span class="status-num" id="stat-mastered">0</span>
                        <span class="status-label">已熟知</span>
                    </div>
                    <div class="status-card">
                        <span class="status-num" id="stat-total">0</span>
                        <span class="status-label">诗词总数</span>
                    </div>
                </div>
                <button class="btn-start" id="btn-start-learn">
                    <span class="btn-start-icon">📖</span>
                    <span>开始学习</span>
                </button>
                <div class="home-done hidden" id="home-done">
                    <div class="done-icon">🎉</div>
                    <p>今日学习已完成！</p>
                    <p class="done-sub">明日再来，坚持就是胜利</p>
                    <button class="btn-advance-review hidden" id="btn-advance-review">
                        <span class="btn-advance-icon">⏩</span>
                        <span>提前复习明天的内容</span>
                    </button>
                    <button class="btn-continue hidden" id="btn-continue-learn">
                        <span class="btn-continue-icon">📚</span>
                        <span>继续学一首</span>
                    </button>
                </div>
            </section>

            <section id="page-learn" class="page">
                <div class="poem-card" id="poem-card">
                    <div class="poem-badge" id="poem-badge">新学</div>
                    <h3 class="poem-title" id="poem-title"></h3>
                    <p class="poem-author" id="poem-author"></p>
                    <div class="poem-detail" id="poem-detail">
                        <div class="poem-content" id="poem-content"></div>
                        <div class="poem-pinyin" id="poem-pinyin"></div>
                        <div class="poem-notes" id="poem-notes"></div>
                        <div class="poem-analysis" id="poem-analysis"></div>
                    </div>
                    <div class="poem-image-wrap" id="poem-image-wrap">
                        <img class="poem-image" id="poem-image" alt="诗词配图">
                    </div>
                    <button class="btn-show-poem hidden" id="btn-show-poem">
                        <span>📖 显示诗词内容</span>
                    </button>
                </div>
                <div class="action-buttons" id="action-buttons">
                    <div class="main-actions">
                        <button class="btn-action btn-know" data-action="know">
                            <span class="btn-icon">😊</span>
                            <span>认识</span>
                        </button>
                        <button class="btn-action btn-fuzzy" data-action="fuzzy">
                            <span class="btn-icon">🤔</span>
                            <span>模糊</span>
                        </button>
                        <button class="btn-action btn-forget" data-action="forget">
                            <span class="btn-icon">😵</span>
                            <span>忘记</span>
                        </button>
                    </div>
                    <button class="btn-mastered" data-action="mastered">
                        <span>🏆 已熟知（不再复习）</span>
                    </button>
                </div>
            </section>

            <div class="image-viewer hidden" id="image-viewer">
                <div class="viewer-backdrop" id="viewer-backdrop"></div>
                <div class="viewer-container">
                    <img class="viewer-image" id="viewer-image" alt="诗词配图">
                </div>
                <div class="viewer-controls">
                    <button class="viewer-btn" id="viewer-zoom-in" title="放大">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="currentColor"
                                d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM12 10h-2v2H9v-2H7V9h2V7h1v2h2v1z" />
                        </svg>
                    </button>
                    <button class="viewer-btn" id="viewer-zoom-out" title="缩小">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="currentColor"
                                d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM7 9h5v1H7z" />
                        </svg>
                    </button>
                    <button class="viewer-btn" id="viewer-close" title="关闭">
                        <svg viewBox="0 0 24 24" width="24" height="24">
                            <path fill="currentColor"
                                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                        </svg>
                    </button>
                </div>
            </div>

            <section id="page-stats" class="page">
                <div class="page-title-bar">
                    <button class="btn-back" id="btn-back-stats">←</button>
                    <h2>学习统计</h2>
                </div>
                <div class="stats-grid">
                    <div class="stat-block">
                        <div class="stat-big" id="stats-learned">0</div>
                        <div class="stat-desc">已学习</div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-big" id="stats-reviewing">0</div>
                        <div class="stat-desc">复习中</div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-big" id="stats-mastered">0</div>
                        <div class="stat-desc">已熟知</div>
                    </div>
                    <div class="stat-block">
                        <div class="stat-big" id="stats-remaining">0</div>
                        <div class="stat-desc">未学习</div>
                    </div>
                </div>
                <div class="memory-chart" id="memory-chart">
                    <h3>记忆等级分布</h3>
                    <div class="chart-bars" id="chart-bars"></div>
                </div>
                <div class="poem-list-section">
                    <h3>诗词列表</h3>
                    <div class="poem-filter">
                        <button class="filter-btn active" data-filter="all">全部</button>
                        <button class="filter-btn" data-filter="learning">学习中</button>
                        <button class="filter-btn" data-filter="mastered">已熟知</button>
                        <button class="filter-btn" data-filter="unlearned">未学习</button>
                    </div>
                    <div class="poem-list" id="poem-list"></div>
                </div>
            </section>

            <section id="page-admin" class="page">
                <div class="page-title-bar">
                    <button class="btn-back" id="btn-back-admin">←</button>
                    <h2>诗词管理</h2>
                </div>
                <div class="admin-header">
                    <button class="btn-admin-add" id="btn-admin-add">➕ 新增诗词</button>
                </div>
                <div class="admin-form-wrap hidden" id="admin-form-wrap">
                    <h3 class="admin-form-title" id="admin-form-title">新增诗词</h3>
                    <form id="admin-form">
                        <div class="form-row">
                            <label>JSON 数据</label>
                            <textarea id="admin-poems-json" rows="20" placeholder='[&#10;  {&#10;    "id": 1,&#10;    "title": "静夜思",&#10;    "author": "【唐】李白",&#10;    "content": ["床前明月光，","疑是地上霜。","举头望明月，","低头思故乡。"],&#10;    "pinyin": ["chuáng qián míng yuè guāng，","yí shì dì shàng shuāng。","",""],&#10;    "keywords": [{"word":"明月","note":"明亮的月光"}],&#10;    "analysis": {&#10;      "lineNotes": [&#10;        {"line":"床前明月光，","note":"月光洒在床前。"},&#10;        {"line":"疑是地上霜。","note":"让人以为是地上落了霜。"},&#10;        {"line":"举头望明月，","note":"抬头看天上圆月。"},&#10;        {"line":"低头思故乡。","note":"低头想起远方的故乡。"}&#10;      ],&#10;      "overall": "全诗借月夜思乡，表达游子对故乡的深切思念。"&#10;    }&#10;  }&#10;]'></textarea>
                        </div>
                        <div class="admin-form-actions">
                            <button type="button" class="btn-modal btn-modal-cancel" id="btn-admin-cancel">取消</button>
                            <button type="submit" class="btn-modal btn-modal-confirm">💾 保存诗词</button>
                        </div>
                    </form>
                </div>
                <div class="admin-poem-list" id="admin-poem-list"></div>
            </section>

            <section id="page-data" class="page">
                <div class="page-title-bar">
                    <button class="btn-back" id="btn-back-data">←</button>
                    <h2>数据管理</h2>
                </div>
                <div class="data-actions">
                    <div class="data-card">
                        <div class="data-icon">📤</div>
                        <h3>导出数据</h3>
                        <p>将学习数据导出为文件，可用于备份或跨设备同步</p>
                        <button class="btn-data-action" id="btn-export">导出数据库</button>
                    </div>
                    <div class="data-card">
                        <div class="data-icon">📥</div>
                        <h3>导入数据</h3>
                        <p>从备份文件恢复学习数据，导入后将覆盖当前数据</p>
                        <button class="btn-data-action" id="btn-import">导入数据库</button>
                        <input type="file" id="file-import" accept=".db,.sqlite,.sqlite3" style="display:none">
                    </div>
                    <div class="data-card data-card-danger">
                        <div class="data-icon">🗑️</div>
                        <h3>重置数据</h3>
                        <p>清除所有学习记录，恢复初始状态（诗词库保留）</p>
                        <button class="btn-data-action btn-danger" id="btn-reset">重置学习记录</button>
                    </div>
                </div>
            </section>
        </main>

        <div class="toast hidden" id="toast"></div>

        <div class="modal-overlay hidden" id="modal-overlay">
            <div class="modal" id="modal">
                <h3 id="modal-title"></h3>
                <p id="modal-msg"></p>
                <div class="modal-actions">
                    <button class="btn-modal btn-modal-cancel" id="modal-cancel">取消</button>
                    <button class="btn-modal btn-modal-confirm" id="modal-confirm">确认</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
    <script src="poems-data.js"></script>
    <script src="app.js"></script>
</body>

</html>
